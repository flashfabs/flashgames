<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alertas sonoros · Pimp My Farm</title><style>body{font:16px system-ui;background:#152d22;color:#f8f0d4;margin:0;padding:32px}main{max-width:660px;margin:auto}h1{color:#ffe5a5}p{color:#e5dfc6}.sons{display:grid;gap:12px}button{border:1px solid #d0b976;border-radius:12px;background:#304d38;color:white;text-align:left;padding:16px;font:700 16px system-ui;cursor:pointer}button:hover{background:#466b4c}small{display:block;font-weight:400;margin-top:5px;color:#e8e0c7}</style><main><h1>🔊 Alertas do Pimp My Farm</h1><p>Clique em cada botão para ouvir o som atual do jogo. Ajuste o volume do aparelho se necessário.</p><div class="sons"><button data-som="urgencia">⏱️ Aviso de urgência · 15 e 5 segundos<small>Alerta quando faltam 15 e 5 segundos para o fim do turno.</small></button><button data-som="inicio">📯 Início da partida · cornetas<small>Melodia de confirmação com som de trompete.</small></button><button data-som="vez">🔔 Mudança de turno · sinos<small>Quando a vez passa para outro jogador.</small></button><button data-som="recurso">📦 Recebimento de recursos · caixa registradora<small>Som de teclas e campainha de caixa registradora.</small></button><button data-som="construcao">📦 Construção · britadeira<small>Britadeira perfurando concreto.</small></button><button data-som="dados">🎲 Dados rolando<small>Dados rolando e batendo sobre a mesa.</small></button><button data-som="clique">👆 Clique em botão<small>Toque curto nas ações e menus.</small></button></div></main><p id="estado-som" role="status" aria-live="polite"></p><script type="module">import { tocarSom } from './js/farm/sons.js'; document.addEventListener('click', async e => { const botao=e.target.closest('[data-som]'); if(!botao)return; const estado=document.querySelector('#estado-som'); estado.textContent='Reproduzindo…'; const tocou=await tocarSom(botao.dataset.som); estado.textContent=tocou?'Som reproduzido.':'O navegador bloqueou o áudio. Verifique se a aba está sem som e tente novamente.'; });</script></html>
