<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prévia das construções · Pimp My Farm</title><link rel="stylesheet" href="css/farm.css"><style>body{background:#132c20;color:#fff2d1;padding:26px;font:15px system-ui}.previa{max-width:850px;margin:auto}.previa h1{color:#ffe3a4;margin:0 0 8px}.previa p{color:#e3dbbf}.exemplos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.exemplo{padding:16px;background:#243d31;border:1px solid #9ab28366;border-radius:16px}.exemplo{background-image:linear-gradient(rgba(15,38,27,.68),rgba(15,38,27,.52) 45%,rgba(15,38,27,.66)),url('img/farm-painel-direito-v2.png');background-size:cover;background-position:center}.exemplo h2{font-size:16px;color:#ffe3a4}.exemplo .botoes-construcao{display:flex;gap:8px;align-items:center}.exemplo .botoes-construcao button{width:56px;height:52px;padding:8px;border:1px solid #ffe5a399;border-radius:10px;background:#405c3a}.exemplo .botoes-construcao button.comprar-desenvolvimento{width:max-content;height:auto;background:transparent;border:0;padding:2px;box-shadow:none}.exemplo .botoes-construcao svg{width:32px;height:32px}.exemplo .carta-desenvolvimento svg{width:32px;height:32px}.exemplo .botoes-construcao button:not(.comprar-desenvolvimento){display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:64px;height:70px;padding:5px}.exemplo .contagem-construcao{position:static;font-size:12px;line-height:16px;min-width:20px;padding:1px 4px}@media(max-width:650px){.exemplos{grid-template-columns:1fr}}</style></head><body><main class="previa"><h1>🏡 Construções disponíveis</h1><p>Os números junto aos ícones mostram quantas peças ainda podem ser usadas. A carta roxa fica à direita das construções.</p><div class="exemplos" id="exemplos"></div><p>Os números abaixo são exemplos; no jogo, mudam conforme as construções de cada jogador.</p></main><script>
const NS='http://www.w3.org/2000/svg';const svg=(nome,attrs={})=>{const e=document.createElementNS(NS,nome);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,String(v));return e};
function icon(tipo,cor){const e=svg('svg',{viewBox:'0 0 24 24','aria-hidden':'true'});if(tipo==='estrada'){e.append(svg('path',{d:'M3 18 L21 6',fill:'none',stroke:'#151515','stroke-width':7,'stroke-linecap':'round'}),svg('path',{d:'M3 18 L21 6',fill:'none',stroke:cor,'stroke-width':5,'stroke-linecap':'round'}));return e;}if(tipo==='cidade'){e.append(svg('path',{d:'M2 21 V11 L7 7 L11 10.2 V8 L16 3 L22 8 V21 Z',fill:cor,stroke:'#151515','stroke-width':1.2,'stroke-linejoin':'round'}),svg('path',{d:'M11 10.2 V21 M4 14 H6 M8 14 H9 M4 17 H6 M8 17 H9 M13 10 H15 M18 10 H20 M13 13 H15 M18 13 H20 M14 21 V17 H19 V21',fill:'none',stroke:'#151515','stroke-width':1.1}));return e;}e.append(svg('path',{d:'M2 11 L12 3 L22 11 L20 11 L20 21 L4 21 L4 11 Z',fill:cor,stroke:'#151515','stroke-width':1.2,'stroke-linejoin':'round'}),svg('path',{d:'M9 21 V14 H15 V21 M4 11 L12 4 L20 11',fill:'none',stroke:'#151515','stroke-width':1.1}));return e;}
function carta(){const b=document.createElement('button');b.type='button';b.className='comprar-desenvolvimento';b.setAttribute('aria-label','Carta de desenvolvimento, 25 disponíveis');const c=document.createElement('span');c.className='carta-desenvolvimento';const e=svg('svg',{viewBox:'0 0 24 24','aria-hidden':'true'});e.append(svg('path',{d:'M10 1h4l.6 2.4 1.9.8 2.1-1.3 2.8 2.8-1.3 2.1.8 1.9L23 10v4l-2.4.6-.8 1.9 1.3 2.1-2.8 2.8-2.1-1.3-1.9.8L14 23h-4l-.6-2.4-1.9-.8-2.1 1.3-2.8-2.8 1.3-2.1-.8-1.9L1 14v-4l2.4-.6.8-1.9-1.3-2.1 2.8-2.8 2.1 1.3 1.9-.8z',fill:'#fff',stroke:'#173b27','stroke-width':'.65','stroke-linejoin':'round'}),svg('circle',{cx:12,cy:12,r:3.2,fill:'#6e3699'}));c.append(e);const n=document.createElement('span');n.className='cartas-quantidade';n.textContent='25';c.append(n);b.append(c);return b;}
for(const [titulo,numeros] of [['Antes de construir',[15,5,4]],['Após duas estradas e duas aldeias',[13,3,4]]]){const sec=document.createElement('section');sec.className='exemplo acoes';const h=document.createElement('h2');h.textContent=titulo;const linha=document.createElement('div');linha.className='botoes-construcao';[['estrada','Estrada'],['fazenda','Aldeia'],['cidade','Cidade']].forEach(([tipo,nome],i)=>{const b=document.createElement('button');b.type='button';b.setAttribute('aria-label',`${nome}: ${numeros[i]} disponíveis`);b.title=b.getAttribute('aria-label');b.append(icon(tipo,'#ef5450'));const n=document.createElement('span');n.className='contagem-construcao';n.textContent=numeros[i];b.append(n);linha.append(b);});linha.append(carta());sec.append(h,linha);document.querySelector('#exemplos').append(sec);}
</script></body></html>
