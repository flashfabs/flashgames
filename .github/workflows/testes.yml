# Every pull request and every push to main or to rts/base (the RTS integration branch) runs the unit tests, the functional end-to-end tests and the RTS determinism barrier in Chromium, Firefox and WebKit.
# Nothing is published here: Netlify builds and publishes from GitHub on its own.
# The performance suite stays on the Mac: it measures the Mac's GPU through Metal, and these runners have none.
name: Testes

on:
  pull_request:
  push:
    branches: [main, rts/base]
  workflow_dispatch:

# A newer push to the same pull request cancels the run still going; runs on main and rts/base always finish.
concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Full history, so the RTS originality test can read every commit message in origin/main..HEAD.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The pull request title and body go through the environment, never into the shell command line.
      - name: Unit tests
        run: npm test
        env:
          RTS_TEXTO_EXTRA: |
            ${{ github.event.pull_request.title }}
            ${{ github.event.pull_request.body }}

      - name: Install the browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: End-to-end tests
        run: SALINHA_PROCESSOS=2 npx playwright test --project=funcionais

      # The same RTS matches inside a Worker of each engine must give the same checksums as Node.
      - name: RTS determinism in three engines
        run: npx playwright test --project='rts-determinismo-*'

      - name: Keep test traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
