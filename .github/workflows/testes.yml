# Every pull request and every push to main runs the unit tests and the functional end-to-end tests.
# Nothing is published here: Netlify builds and publishes from GitHub on its own.
# The performance suite stays on the Mac: it measures the Mac's GPU through Metal, and these runners have none.
name: Testes

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same pull request cancels the run still going; runs on main always finish.
concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: SALINHA_PROCESSOS=2 npx playwright test --project=funcionais

      - name: Keep test traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
